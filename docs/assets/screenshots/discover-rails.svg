<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Seerr Discover rails screenshot</title>
  <desc id="desc">A sanitized Jellyfin Web screenshot showing the Seerr Discover tab with browse rails and media cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset="0.58" stop-color="#141820"/>
      <stop offset="1" stop-color="#202225"/>
    </linearGradient>
    <linearGradient id="posterA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3db8a4"/>
      <stop offset="1" stop-color="#3155a4"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d36b59"/>
      <stop offset="1" stop-color="#7041a6"/>
    </linearGradient>
    <linearGradient id="posterC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b44b"/>
      <stop offset="1" stop-color="#2d846d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="72" fill="#0b0f14"/>
  <circle cx="40" cy="36" r="18" fill="#00a4dc"/>
  <text x="72" y="43" fill="#f2f6f9" font-family="Arial, sans-serif" font-size="24" font-weight="700">Jellyfin</text>
  <text x="218" y="43" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="18">Home</text>
  <text x="294" y="43" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="18">Favorites</text>
  <text x="406" y="43" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Discover</text>
  <rect x="398" y="62" width="82" height="3" rx="1.5" fill="#00a4dc"/>
  <rect x="1040" y="20" width="176" height="32" rx="16" fill="#18202a"/>
  <text x="1061" y="42" fill="#c6d1dc" font-family="Arial, sans-serif" font-size="14">Sanitized demo</text>

  <g transform="translate(64 112)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Discover</text>
    <text x="0" y="34" fill="#9faab6" font-family="Arial, sans-serif" font-size="18">Browse requestable Seerr results from inside Jellyfin Web.</text>

    <g transform="translate(0 92)">
      <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Trending movies</text>
      <g transform="translate(0 24)" filter="url(#shadow)">
        <rect x="0" y="0" width="144" height="216" rx="8" fill="url(#posterA)"/>
        <rect x="12" y="144" width="64" height="22" rx="11" fill="rgba(10,15,20,0.65)"/>
        <text x="24" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Movie</text>
        <text x="0" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Solar Harbor</text>
        <text x="0" y="268" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Requestable</text>
      </g>
      <g transform="translate(172 24)" filter="url(#shadow)">
        <rect x="0" y="0" width="144" height="216" rx="8" fill="url(#posterB)"/>
        <rect x="12" y="144" width="78" height="22" rx="11" fill="rgba(10,15,20,0.65)"/>
        <text x="24" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Available</text>
        <text x="0" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Lunar Signal</text>
        <text x="0" y="268" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Watch now</text>
      </g>
      <g transform="translate(344 24)" filter="url(#shadow)">
        <rect x="0" y="0" width="144" height="216" rx="8" fill="url(#posterC)"/>
        <rect x="12" y="144" width="74" height="22" rx="11" fill="rgba(10,15,20,0.65)"/>
        <text x="24" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Series</text>
        <text x="0" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Northline</text>
        <text x="0" y="268" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Requested</text>
      </g>
      <g transform="translate(516 24)" filter="url(#shadow)">
        <rect x="0" y="0" width="144" height="216" rx="8" fill="url(#posterA)"/>
        <text x="0" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Quiet Orbit</text>
        <text x="0" y="268" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Requestable</text>
      </g>
      <g transform="translate(688 24)" filter="url(#shadow)">
        <rect x="0" y="0" width="144" height="216" rx="8" fill="url(#posterB)"/>
        <text x="0" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Afterlight</text>
        <text x="0" y="268" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Requestable</text>
      </g>
    </g>

    <g transform="translate(0 440)">
      <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Popular TV</text>
      <rect x="0" y="26" width="1060" height="86" rx="12" fill="#161d26"/>
      <circle cx="44" cy="69" r="24" fill="#3db8a4"/>
      <text x="84" y="62" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Seerr-powered rails stay inside Jellyfin</text>
      <text x="84" y="88" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="15">Requests and availability are proxied through authenticated plugin endpoints.</text>
    </g>
  </g>
</svg>
