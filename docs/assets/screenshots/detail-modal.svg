<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Seerr Discover detail modal screenshot</title>
  <desc id="desc">A sanitized Jellyfin Web screenshot showing the Seerr Discover detail modal with request and handoff actions.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f151d"/>
      <stop offset="1" stop-color="#222326"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2db5a3"/>
      <stop offset="0.5" stop-color="#4c54a8"/>
      <stop offset="1" stop-color="#cf6a57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#page)"/>
  <rect x="0" y="0" width="1280" height="720" fill="#000" opacity="0.36"/>
  <g filter="url(#shadow)">
    <rect x="168" y="62" width="944" height="596" rx="18" fill="#111820"/>
    <rect x="168" y="62" width="944" height="220" rx="18" fill="url(#hero)"/>
    <rect x="168" y="190" width="944" height="92" fill="rgba(17,24,32,0.62)"/>
    <rect x="218" y="162" width="166" height="248" rx="10" fill="#202a36" stroke="#445060"/>
    <rect x="238" y="182" width="126" height="180" rx="8" fill="#2db5a3" opacity="0.84"/>
    <text x="238" y="392" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="14">Sanitized poster</text>
    <g transform="translate(420 220)">
      <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Solar Harbor</text>
      <text x="0" y="32" fill="#c8d2dc" font-family="Arial, sans-serif" font-size="17">2026 - Movie - 2h 8m - PG-13</text>
      <rect x="0" y="58" width="86" height="30" rx="15" fill="#223044"/>
      <text x="22" y="78" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="13">Movie</text>
      <rect x="98" y="58" width="112" height="30" rx="15" fill="#143d37"/>
      <text x="122" y="78" fill="#9af0de" font-family="Arial, sans-serif" font-size="13">Available</text>
    </g>
    <g transform="translate(420 336)">
      <rect x="0" y="0" width="116" height="42" rx="21" fill="#00a4dc"/>
      <text x="28" y="27" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Request</text>
      <rect x="132" y="0" width="136" height="42" rx="21" fill="#233244"/>
      <text x="160" y="27" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Watch Now</text>
      <rect x="284" y="0" width="134" height="42" rx="21" fill="#233244"/>
      <text x="306" y="27" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Open Details</text>
      <rect x="434" y="0" width="132" height="42" rx="21" fill="#233244"/>
      <text x="462" y="27" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Trailer</text>
    </g>
    <g transform="translate(420 414)">
      <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Overview</text>
      <text x="0" y="34" fill="#b8c3ce" font-family="Arial, sans-serif" font-size="16">A lighthouse technician finds a signal that points to a missing ship,</text>
      <text x="0" y="60" fill="#b8c3ce" font-family="Arial, sans-serif" font-size="16">a forgotten archive, and a request waiting to be made.</text>
      <text x="0" y="112" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cast and crew</text>
      <rect x="0" y="134" width="610" height="58" rx="12" fill="#17212b"/>
      <circle cx="34" cy="163" r="18" fill="#445060"/>
      <text x="70" y="158" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Generated Person</text>
      <text x="70" y="180" fill="#9faab6" font-family="Arial, sans-serif" font-size="13">Lead role</text>
    </g>
    <text x="1068" y="104" fill="#dbe5ee" font-family="Arial, sans-serif" font-size="28">x</text>
  </g>
