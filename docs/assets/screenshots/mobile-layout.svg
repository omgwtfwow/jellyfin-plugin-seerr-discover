<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized mobile Seerr Discover screenshot</title>
  <desc id="desc">A sanitized narrow viewport screenshot showing Seerr Discover rails and cards on a mobile layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f151d"/>
      <stop offset="1" stop-color="#222326"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2db5a3"/>
      <stop offset="1" stop-color="#4c54a8"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf6a57"/>
      <stop offset="1" stop-color="#7f4db2"/>
    </linearGradient>
  </defs>
  <rect width="720" height="960" fill="#0a0d12"/>
  <rect x="104" y="28" width="512" height="904" rx="52" fill="#080b10"/>
  <rect x="132" y="76" width="456" height="808" rx="28" fill="url(#bg)"/>
  <rect x="132" y="76" width="456" height="58" rx="28" fill="#0b0f14"/>
  <text x="168" y="113" fill="#f2f6f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">Jellyfin</text>
  <text x="356" y="113" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Discover</text>
  <rect x="344" y="126" width="74" height="3" rx="1.5" fill="#00a4dc"/>
  <g transform="translate(160 174)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Discover</text>
    <text x="0" y="30" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="15">Browse rails on narrow clients.</text>
    <text x="0" y="86" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Trending</text>
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="176" height="264" rx="10" fill="url(#cardA)"/>
      <rect x="12" y="202" width="76" height="24" rx="12" fill="rgba(10,15,20,0.65)"/>
      <text x="26" y="219" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Movie</text>
      <text x="0" y="294" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Solar Harbor</text>
      <text x="0" y="318" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Requestable</text>
    </g>
    <g transform="translate(206 110)">
      <rect x="0" y="0" width="176" height="264" rx="10" fill="url(#cardB)"/>
      <rect x="12" y="202" width="94" height="24" rx="12" fill="rgba(10,15,20,0.65)"/>
      <text x="26" y="219" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Available</text>
      <text x="0" y="294" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Northline</text>
      <text x="0" y="318" fill="#9faab6" font-family="Arial, sans-serif" font-size="14">Watch now</text>
    </g>
    <rect x="0" y="488" width="382" height="104" rx="16" fill="#151d27"/>
    <text x="24" y="526" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Client refresh friendly</text>
    <text x="24" y="552" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="14">After upgrading, hard-refresh or restart</text>
    <text x="24" y="574" fill="#aeb7c1" font-family="Arial, sans-serif" font-size="14">the client to load the new asset version.</text>
  </g>
  <rect x="314" y="894" width="92" height="8" rx="4" fill="#283242"/>
</svg>
