name: Publish Plugin Repository

on:
  workflow_dispatch:
  release:
    types:
      - published
      - edited

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release manifest
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          mkdir -p dist/pages
          curl -fL \
            "https://github.com/${{ github.repository }}/releases/download/v${version}/manifest.json" \
            -o dist/pages/manifest.json

      - name: Prepare Pages artifact
        run: |
          touch dist/pages/.nojekyll
          cat >dist/pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Seerr Discover Jellyfin Plugin Repository</title>
            </head>
            <body>
              <h1>Seerr Discover Jellyfin Plugin Repository</h1>
              <p>Use <code>manifest.json</code> as the Jellyfin plugin repository URL.</p>
            </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - id: deployment
        uses: actions/deploy-pages@v4
