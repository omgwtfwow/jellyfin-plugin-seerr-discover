name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SeerrDiscover.sln

      - name: Test
        run: dotnet test Jellyfin.Plugin.SeerrDiscover.sln --no-restore

      - name: Release build
        run: dotnet build Jellyfin.Plugin.SeerrDiscover/Jellyfin.Plugin.SeerrDiscover.csproj -c Release --no-restore

      - name: JavaScript syntax
        run: node --check Jellyfin.Plugin.SeerrDiscover/Web/discover.js

      - name: Shell syntax
        run: bash -n scripts/package-plugin.sh scripts/generate-manifest.sh

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        run: scripts/package-plugin.sh

      - name: Generate manifest
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          scripts/generate-manifest.sh --base-url "https://github.com/${{ github.repository }}/releases/download/v${version}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seerr-discover-dist
          path: dist/
